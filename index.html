<style>
/* Layout concept: a full-bleed pan/zoom canvas of clear, refracting glass cards grouped into department panels,
   floating over an iridescent fluid ground (liquidGL look). Tricolour logo palette: saffron, green, navy. */
:root{
  --bg0:#E8E8F0; --bg1:#F5F5FA;
  --ink:#0F1124; --muted:#5B5E7E; --faint:#9496AF;
  --accent:#F27A10; --accent-ink:#fff; --btn:#0F1124; --btn-ink:#fff; --focus:#2F5BFF;
  --wire:#7B83AE;
  --g-a:rgba(255,255,255,.64); --g-b:rgba(255,255,255,.30);
  --g-edge:rgba(255,255,255,.85); --g-hi:rgba(255,255,255,.98); --g-lo:rgba(80,90,160,.18); --g-glow:rgba(255,255,255,.35);
  --g-shadow:rgba(28,36,128,.24); --panel:rgba(255,255,255,.30); --panel-edge:rgba(255,255,255,.8);
  --field:rgba(255,255,255,.6); --field-edge:rgba(15,17,36,.13); --plate:#FFFFFF; --plate-edge:rgba(15,17,36,.09);
  --blur:18px; --orb:.62; --chroma-r:rgba(255,80,150,.22); --chroma-b:rgba(50,170,255,.26);
  --t-exec:#1C2480; --t-head:#12873A; --t-senior:#F27A10; --t-team:#6A7BA6; --t-unit:#6A6E92;
  --f1a:#5B74FF; --f1b:#7FDCFF; --f1c:#C3A8FF; --f1d:#FFD2B2; --f1e:#8EA0FF;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; --serif:"Libre Baskerville",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg0:#05051A; --bg1:#0C0B2E; --ink:#F3F4FF; --muted:#A6ABD2; --faint:#6E739C;
  --accent:#FFA24D; --accent-ink:#1B0B00; --btn:#F5F6FF; --btn-ink:#0B0B22; --focus:#8AA8FF; --wire:#5D66A8;
  --g-a:rgba(255,255,255,.085); --g-b:rgba(255,255,255,.03);
  --g-edge:rgba(255,255,255,.2); --g-hi:rgba(255,255,255,.3); --g-lo:rgba(0,0,10,.5); --g-glow:rgba(255,255,255,.04);
  --g-shadow:rgba(0,0,14,.7); --panel:rgba(255,255,255,.035); --panel-edge:rgba(255,255,255,.1);
  --field:rgba(255,255,255,.08); --field-edge:rgba(255,255,255,.2); --plate:#10123F; --plate-edge:rgba(255,255,255,.16); --orb:.44; --chroma-r:rgba(255,90,160,.18); --chroma-b:rgba(70,190,255,.26);
  --t-exec:#AAB3FF; --t-head:#4ADE90; --t-senior:#FFAA5C; --t-team:#95A5CC; --t-unit:#9096BC;
  --f1a:#1A2AB4; --f1b:#1F62D8; --f1c:#4A2CC0; --f1d:#8A2C92; --f1e:#1A2AB4; --sat:1.2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg0:#05051A; --bg1:#0C0B2E; --ink:#F3F4FF; --muted:#A6ABD2; --faint:#6E739C;
  --accent:#FFA24D; --accent-ink:#1B0B00; --btn:#F5F6FF; --btn-ink:#0B0B22; --focus:#8AA8FF; --wire:#5D66A8;
  --g-a:rgba(255,255,255,.085); --g-b:rgba(255,255,255,.03);
  --g-edge:rgba(255,255,255,.2); --g-hi:rgba(255,255,255,.3); --g-lo:rgba(0,0,10,.5); --g-glow:rgba(255,255,255,.04);
  --g-shadow:rgba(0,0,14,.7); --panel:rgba(255,255,255,.035); --panel-edge:rgba(255,255,255,.1);
  --field:rgba(255,255,255,.08); --field-edge:rgba(255,255,255,.2); --orb:.44; --chroma-r:rgba(255,90,160,.18); --chroma-b:rgba(70,190,255,.26);
  --t-exec:#AAB3FF; --t-head:#4ADE90; --t-senior:#FFAA5C; --t-team:#95A5CC; --t-unit:#9096BC;
  --f1a:#1A2AB4; --f1b:#1F62D8; --f1c:#4A2CC0; --f1d:#8A2C92; --f1e:#1A2AB4; --sat:1.2; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg0);color:var(--ink);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* iridescent ground behind the glass */
#ambient{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--bg1),var(--bg0))}
#ambient .layer{position:absolute;inset:-20%;transition:transform .12s linear}
.fl{position:absolute;left:50%;top:48%;border-radius:50%;opacity:var(--orb);will-change:transform;-webkit-mask-image:radial-gradient(closest-side,#000 28%,transparent 100%);mask-image:radial-gradient(closest-side,#000 28%,transparent 100%)}
.f1{width:96vmax;height:96vmax;margin:-48vmax 0 0 -48vmax;background:conic-gradient(from 30deg,var(--f1a),var(--f1b),var(--f1c),var(--f1d),var(--f1e),var(--f1a));filter:blur(70px);animation:spin 120s linear infinite}
.f2{width:58vmax;height:58vmax;margin:-29vmax 0 0 -29vmax;background:conic-gradient(from 210deg,var(--f1b),var(--f1c),var(--f1a),var(--f1b));filter:blur(54px);animation:spin 80s linear infinite reverse;opacity:calc(var(--orb) * .8)}
@keyframes spin{to{transform:rotate(360deg)}}
#ambient::after{content:"";position:absolute;inset:0;opacity:.4;
  background-image:linear-gradient(color-mix(in srgb,var(--ink) 6%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--ink) 6%,transparent) 1px,transparent 1px);background-size:64px 64px}

/* liquid glass: clear body, chromatic rim, specular edge */
.glass{position:relative;
  background:linear-gradient(145deg,var(--g-a),var(--g-b));
  -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat,1.9)) brightness(1.05);backdrop-filter:blur(var(--blur)) saturate(var(--sat,1.9)) brightness(1.05);
  border:1px solid var(--g-edge);
  box-shadow:inset 1.4px 0 0 var(--chroma-r),inset -1.4px 0 0 var(--chroma-b),inset 0 1px 0 var(--g-hi),inset 0 -1px 0 var(--g-lo),inset 0 0 22px var(--g-glow),0 16px 36px -14px var(--g-shadow),0 2px 6px -2px var(--g-shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(158deg,rgba(255,255,255,.46) 0%,rgba(255,255,255,0) 34%),radial-gradient(90% 70% at 100% 110%,rgba(255,255,255,.18),transparent 60%);opacity:.9}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,0) 28%,rgba(255,255,255,0) 72%,rgba(255,255,255,.6));
  -webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;opacity:.75}
@supports not (backdrop-filter:blur(1px)){.glass{background:var(--bg1)}}
/* fluid refraction on the floating chrome (Chromium); other browsers keep the blur above */
.bar,.dock,.zoom,.sheet,.menu{-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat,1.9)) brightness(1.05);backdrop-filter:blur(var(--blur)) saturate(var(--sat,1.9)) brightness(1.05)}
@supports (backdrop-filter:url(#lg)){.bar,.dock,.zoom{backdrop-filter:blur(10px) saturate(var(--sat,1.9)) brightness(1.05) url(#lg)}}

/* header */
.bar{position:fixed;z-index:20;left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:14px;padding:8px 12px 8px 8px;border-radius:26px}
.brand{display:flex;align-items:center;gap:13px;min-width:0;background:var(--plate);border:1px solid var(--plate-edge);border-radius:20px;padding:6px 20px 6px 6px;box-shadow:0 8px 20px -10px var(--g-shadow),0 1px 2px rgba(0,0,0,.06);position:relative;z-index:1}
.mark{width:52px;height:52px;flex:none;display:block;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(15,17,36,.08)}
.bt{min-width:0}
.brand h1{margin:0;font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;color:var(--t-exec)}
:root[data-theme="dark"] .brand h1{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand h1{color:var(--ink)}}
.brand h1 .short{display:none}
.brand .tag{margin:3px 0 0;font-size:11.5px;font-weight:500;letter-spacing:.005em;color:var(--muted);white-space:nowrap}
.brand .tag::before{content:"";display:inline-block;width:18px;height:2px;border-radius:2px;margin-right:7px;vertical-align:middle;background:linear-gradient(90deg,#F27A10 0 33%,#cfd3e6 33% 66%,#12873A 66%)}
.stats{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.grow{flex:1}
.search{position:relative;display:flex;align-items:center;flex:0 1 300px;min-width:0}
.search svg{position:absolute;left:11px;color:var(--faint);pointer-events:none}
.search input{width:100%;height:36px;border-radius:999px;border:1px solid var(--field-edge);background:var(--field);padding:0 62px 0 34px;outline-offset:0}
.search input::placeholder{color:var(--faint)}
.search .cnt{position:absolute;right:12px;font-family:var(--mono);font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.btns{display:flex;align-items:center;gap:6px}
.ib,.pill{height:36px;border-radius:999px;border:1px solid var(--field-edge);background:var(--field);display:inline-flex;align-items:center;justify-content:center;gap:7px;color:var(--ink);transition:background .15s,transform .1s}
.ib{width:36px;padding:0}
.pill{padding:0 14px;font-weight:600;font-size:13px;white-space:nowrap}
.ib:hover,.pill:hover{background:color-mix(in srgb,var(--field) 60%,var(--g-hi))}
.ib:active,.pill:active{transform:scale(.96)}
.ib:disabled{opacity:.35;cursor:default}
.pill.on,.pill.solid{background:var(--btn);border-color:transparent;color:var(--btn-ink)}
.pill.primary{background:var(--btn);border-color:transparent;color:var(--btn-ink);width:100%;height:40px}
.sep{width:1px;height:22px;background:var(--field-edge);margin:0 2px}
.status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--t-head);display:block}
.status.warn i{background:var(--accent)}

/* stage */
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;z-index:1}
#stage.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#wires path{fill:none;stroke:var(--wire);stroke-linecap:round;stroke-linejoin:round}
#wires circle{fill:var(--wire)}
#wires path,#wires circle{transition:opacity .2s,stroke .2s}
.chain #wires path{opacity:.22}.chain #wires circle{opacity:.22}
.chain #wires path.hl{opacity:1;stroke:var(--accent)}.chain #wires circle.hl{opacity:1;fill:var(--accent)}
.chain .card:not(.in){opacity:.4}
.panel{position:absolute;border-radius:30px;background:var(--panel);border:1px solid var(--panel-edge);
  box-shadow:inset 0 1px 0 var(--g-hi),0 20px 40px -24px var(--g-shadow);
  -webkit-backdrop-filter:blur(8px) saturate(1.4);backdrop-filter:blur(8px) saturate(1.4)}
.panel b{position:absolute;left:18px;top:9px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.panel b span{color:var(--muted);font-weight:600;margin-left:8px;padding:1px 7px;border-radius:999px;background:var(--field);border:1px solid var(--field-edge);font-variant-numeric:tabular-nums}
.card{position:absolute;border-radius:var(--r,18px);display:flex;align-items:center;gap:var(--gp,10px);padding:0 var(--pd,12px);text-align:left;user-select:none;-webkit-user-select:none;
  background:linear-gradient(145deg,color-mix(in srgb,var(--tc) var(--ta,16%),var(--g-a)),color-mix(in srgb,var(--tc) var(--tb,5%),var(--g-b)));
  -webkit-backdrop-filter:blur(var(--bl,16px)) saturate(var(--sat,1.9)) brightness(1.05);backdrop-filter:blur(var(--bl,16px)) saturate(var(--sat,1.9)) brightness(1.05);
  box-shadow:inset 1.4px 0 0 var(--chroma-r),inset -1.4px 0 0 var(--chroma-b),inset 0 1px 0 var(--g-hi),inset 0 -1px 0 var(--g-lo),0 var(--sy,14px) var(--sb,32px) -12px var(--g-shadow),0 2px 6px -2px var(--g-shadow);
  transition:opacity .2s,transform .15s,box-shadow .2s;cursor:pointer}
/* seniority = elevation, size, tint and weight. Team cards recede, executives lead. */
.card.t-exec{--r:26px;--pd:18px;--gp:16px;--ta:30%;--tb:10%;--bl:22px;--sy:26px;--sb:56px;border-color:color-mix(in srgb,var(--tc) 55%,var(--g-edge))}
.card.t-head{--r:22px;--pd:16px;--gp:13px;--ta:24%;--tb:8%;--bl:20px;--sy:20px;--sb:44px;border-color:color-mix(in srgb,var(--tc) 45%,var(--g-edge))}
.card.t-senior{--r:19px;--pd:13px;--gp:11px;--ta:18%;--tb:5%;--sy:12px;--sb:28px}
.card.t-team{--r:15px;--pd:11px;--gp:9px;--ta:3%;--tb:1%;--bl:8px;--sy:6px;--sb:14px;border-color:color-mix(in srgb,var(--g-edge) 55%,transparent)}
.card::before{background:radial-gradient(130px 90px at var(--mx,20%) var(--my,0%),rgba(255,255,255,.55),transparent 70%),linear-gradient(158deg,rgba(255,255,255,.4),rgba(255,255,255,0) 40%);opacity:.7}
.card:hover{transform:translateY(-1.5px)}
.card.sel{box-shadow:0 0 0 2px var(--accent),0 0 0 6px color-mix(in srgb,var(--accent) 28%,transparent),0 18px 36px -12px var(--g-shadow)}
.card.dim{opacity:.22}
.card.hit{box-shadow:0 0 0 2px var(--focus),0 0 0 6px color-mix(in srgb,var(--focus) 25%,transparent)}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;letter-spacing:.02em;
  background:linear-gradient(150deg,color-mix(in srgb,var(--tc) 72%,#fff),var(--tc));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 6px -1px color-mix(in srgb,var(--tc) 60%,transparent)}
.card.t-exec .av{width:56px;height:56px;font-size:19px}
.card.t-head .av{width:46px;height:46px;font-size:15px}
.card.t-senior .av{width:36px;height:36px;font-size:12.5px}
.card.t-team .av{width:28px;height:28px;font-size:10.5px;font-weight:600;background:linear-gradient(150deg,color-mix(in srgb,var(--tc) 60%,#fff),color-mix(in srgb,var(--tc) 85%,#000))}
.tx{display:flex;flex-direction:column;min-width:0;flex:1;position:relative;z-index:1}
.ti{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{font-size:13.5px;font-weight:650;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.t-exec .nm{font-size:21px;font-weight:700;letter-spacing:-.018em}.t-head .nm{font-size:16.5px;font-weight:700;letter-spacing:-.012em}.t-senior .nm{font-size:14.5px;font-weight:650}.t-team .nm{font-size:13px;font-weight:500}
.t-exec .ti{font-size:10.5px;color:var(--tc)}.t-head .ti{font-size:10px;color:var(--tc)}.t-senior .ti{color:color-mix(in srgb,var(--tc) 80%,var(--muted))}.t-team .ti{font-size:9px;color:var(--muted)}
.t-exec .ph,.t-head .ph{font-size:12.5px}.t-team .ph{font-size:11px;color:var(--muted)}
.nm.vac{font-weight:500;font-style:italic;color:var(--faint)}
.ph{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.card .av{position:relative;z-index:1}
.card.t-unit{justify-content:center;padding:0 16px;border-radius:999px}
.t-unit .ut{font-family:var(--mono);font-weight:600;letter-spacing:.05em}
.ut{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}
.tg{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);z-index:3;height:22px;min-width:22px;padding:0 6px;border-radius:999px;border:1px solid var(--field-edge);
  background:var(--bg1);color:var(--muted);font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums;box-shadow:0 2px 6px -2px var(--g-shadow)}
.tg:hover{color:var(--ink)}
.tg svg{transition:transform .2s}
.tg.closed svg{transform:rotate(-90deg)}

/* dock + controls */
.dock{position:fixed;z-index:15;left:max(16px,env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:22px;max-width:calc(100% - 32px - 214px)}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;padding:1px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid transparent;background:transparent;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip em{font-style:normal;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.chip.on{background:var(--btn);color:var(--btn-ink);box-shadow:0 6px 16px -8px var(--g-shadow)}.chip.on em{color:inherit;opacity:.65}
.chip:hover,.chip:focus-visible{background:var(--g-hi);color:var(--ink);box-shadow:0 4px 12px -6px var(--g-shadow)}
.legend{display:flex;gap:12px;padding:0 10px 0 8px;border-right:1px solid var(--field-edge);margin-right:2px;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);white-space:nowrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:block;background:var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.zoom{position:fixed;z-index:15;right:max(16px,env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;border-radius:22px}
.zoom .ib{border:0;background:transparent}
.zoom .lvl{min-width:46px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

/* sheets */
.sheet{position:fixed;z-index:25;right:max(16px,env(safe-area-inset-right));top:calc(100px + env(safe-area-inset-top,0px));max-height:calc(100% - 196px);width:352px;border-radius:26px;padding:16px;overflow:auto;background:linear-gradient(145deg,color-mix(in srgb,var(--bg1) 82%,transparent),color-mix(in srgb,var(--bg1) 68%,transparent));overscroll-behavior:contain;animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.sheet > *{position:relative;z-index:1}
.ins-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ins-top .av{width:48px;height:48px;font-size:16px}
.ins-top h2{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
.ins-top p{margin:2px 0 0;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ins-top .grow{min-width:0}
.rows{display:grid;gap:10px;margin:0}
.rows div{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;font-size:13px}
.rows dt{color:var(--muted);font-size:12px;padding-top:1px}
.rows dd{margin:0;min-width:0;overflow-wrap:anywhere}
.link{border:0;background:none;padding:0;color:var(--focus);font-weight:600;text-align:left}
.link:hover{text-decoration:underline}
.kids{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.kids .link{background:var(--field);border:1px solid var(--field-edge);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 7px;margin:-4px 0 14px;font-family:var(--mono);font-size:10.5px;color:var(--faint)}.crumbs .link{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--muted)}.crumbs i{font-style:normal;opacity:.6}
.hr{height:1px;background:var(--field-edge);margin:14px 0}
label.f{display:grid;gap:5px;margin-bottom:11px;font-size:12px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{width:100%;border-radius:12px;border:1px solid var(--field-edge);background:var(--field);padding:8px 11px;font-size:13.5px;color:var(--ink);font-weight:500;outline-offset:0}
label.f textarea{resize:vertical;min-height:62px}
label.f select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:grid;gap:8px}
.acts .row{display:flex;gap:8px}
.acts .pill{flex:1;height:36px;font-size:12.5px;padding:0 10px}
.pill.danger{color:#D63B2F;border-color:color-mix(in srgb,#D63B2F 40%,transparent)}
.pill.danger.arm{background:#D63B2F;color:#fff;border-color:transparent}
.hint{font-size:12px;color:var(--muted);margin:0 0 12px}
.menu{background:linear-gradient(145deg,color-mix(in srgb,var(--bg1) 82%,transparent),color-mix(in srgb,var(--bg1) 68%,transparent));position:fixed;z-index:30;right:max(16px,env(safe-area-inset-right));top:calc(100px + env(safe-area-inset-top,0px));width:292px;border-radius:24px;padding:16px;animation:rise .18s ease-out}
.menu > *{position:relative;z-index:1}
.menu h3{margin:0 0 10px;font-size:13px;font-weight:700}
.menu .list{display:grid;gap:6px;margin-top:12px}
.menu .list .pill{justify-content:flex-start;height:38px;border-radius:14px;width:100%}
.menu small{display:block;margin-top:12px;color:var(--muted);font-size:11.5px;line-height:1.45}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);font-weight:500;margin-top:2px}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.toast{position:fixed;z-index:50;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;animation:rise .2s ease-out;max-width:calc(100% - 32px)}
.toast > span{position:relative;z-index:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:1240px){.stats,.status{display:none}}
@media (max-width:1000px){.brand .tag{display:none}}
@media (max-width:860px){
  .bar{flex-wrap:wrap;gap:8px;padding:8px}
  .brand .tag{display:none}
  .brand h1 .long{display:none}.brand h1 .short{display:inline}
  .brand{padding:5px 14px 5px 5px}
  .mark{width:42px;height:42px}
  .brand h1{font-size:15px}
  .search{order:5;flex:1 1 100%}
  .status{display:none}
  .legend{display:none}
  .dock{max-width:calc(100% - 32px)}
  .zoom{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .zoom .lvl{display:none}
  .sheet{left:16px;right:16px;width:auto;top:auto;bottom:calc(66px + env(safe-area-inset-bottom,0px));max-height:56%}
  .menu{left:16px;right:16px;width:auto}
  .pill .lbl{display:none}
  .pill{padding:0;width:36px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="ambient" aria-hidden="true"><div class="layer" id="amb"><i class="fl f1"></i><i class="fl f2"></i></div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="lg" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/></filter></svg>

<header class="bar glass" role="banner">

  <div class="grow"></div>
  <label class="search"><span class="sr">Search people and roles</span>

    <input id="q" type="search" placeholder="Search people or roles" autocomplete="off" spellcheck="false"><span class="cnt" id="cnt"></span></label>
  <div class="btns">
    <div class="status" id="status" role="status"><i></i><span>Saved</span></div>
    <span class="sep"></span>
    <button class="ib" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="ib" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="pill" id="editBtn" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span class="lbl">Edit</span></button>
    <button class="pill solid" id="expBtn" aria-haspopup="true" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span class="lbl">Export</span></button>
    <button class="ib" id="themeBtn" title="Toggle theme" aria-label="Toggle light or dark theme"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>
</header>

<main id="stage" aria-label="Organization chart canvas">
  <div id="world"><div id="panels"></div><svg id="wires" aria-hidden="true"></svg><div id="cards" role="list"></div></div>
</main>

<nav class="dock glass" aria-label="Departments"><div class="legend" id="legend"></div><div class="chips" id="chips"></div></nav>
<div class="zoom glass"><button class="ib" id="zout" aria-label="Zoom out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button><div class="lvl" id="lvl">100%</div><button class="ib" id="zin" aria-label="Zoom in"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><button class="ib" id="fit" aria-label="Fit chart to screen" title="Fit to screen (F)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>

<aside class="sheet glass" id="sheet" hidden aria-label="Details"></aside>

<div class="menu glass" id="menu" hidden>
  <h3>Export and backup</h3>
  <label class="f" style="margin:0 0 8px"><span>PDF page size (landscape)</span>
    <select id="pgsz"><option value="a4">A4</option><option value="a3" selected>A3</option><option value="a2">A2 (wall poster)</option></select></label>
  <label class="chk"><input type="checkbox" id="pdfAll" checked> Include collapsed teams</label>
  <div class="list">
    <button class="pill primary" id="doPdf">Download PDF</button>
    <button class="pill" id="doCsv">Spreadsheet (CSV)</button>
    <button class="pill" id="doJson">Backup (JSON)</button>
    <button class="pill" id="doImport">Import backup</button>
    <button class="pill danger" id="doReset">Reset to original chart</button>
  </div>
  <small>The PDF is vector, so names and numbers stay sharp and searchable at any print size.</small>
  <input type="file" id="file" accept="application/json,.json" hidden>
</div>

/* ---------- layout ---------- */
var G={H:32,LEVEL:60,STACK:10,INDENT:30,SIDE:48,VGAP:18,SG:12};
function tsize(n){var t=TIER[n.tier]||TIER.team;return {w:t.w,h:t.h}}
function lay(n,ignore){
  var sz=tsize(n);
  var all=(n.collapsed&&!ignore)?[]:kidsOf(n.id);
  var main=all.filter(function(k){return !k.side}),L=all.filter(function(k){return k.side==='l'}),R=all.filter(function(k){return k.side==='r'});
  var mb=main.map(function(k){return lay(k,ignore)});
  function stack(arr){var bs=arr.map(function(k){return lay(k,ignore)}),y=0,w=0,pos=[];bs.forEach(function(b){pos.push(y);y+=b.h+G.SG;w=Math.max(w,b.w)});return {bs:bs,pos:pos,w:w,h:Math.max(0,y-G.SG)}}
  var ls=stack(L),rs=stack(R);
  var sideH=Math.max(ls.h,rs.h);
  var rx=0,bw=sz.w,bh=sz.h,kp=[],startY=0,busOff=0;
  if(mb.length){
    if(n.mode==='v'){
      startY=Math.max(sz.h,sideH)+G.VGAP;var y=startY;
      mb.forEach(function(b){kp.push({dx:G.INDENT,dy:y});y+=b.h+G.STACK;bw=Math.max(bw,G.INDENT+b.w)});
      bh=y-G.STACK;
    }else{
      startY=Math.max(sz.h,sideH)+(n.lvl||G.LEVEL);var gap=n.gap||G.H,x=0,mh=0;
      mb.forEach(function(b){kp.push({dx:x,dy:startY});x+=b.w+gap;mh=Math.max(mh,b.h)});
      var span=x-gap,f=kp[0].dx+mb[0].rx+mb[0].cw/2,l=kp[kp.length-1].dx+mb[mb.length-1].rx+mb[mb.length-1].cw/2;
      rx=(f+l)/2-sz.w/2;
      if(rx<0){kp.forEach(function(p){p.dx-=rx});span-=rx;rx=0}
      bw=Math.max(bw,span,rx+sz.w);bh=startY+mh;
    }
  }
  var lx=0;
  if(ls.bs.length){var need=ls.w+G.SIDE;if(rx<need){var sh=need-rx;rx+=sh;kp.forEach(function(p){p.dx+=sh});bw+=sh}}
  var rxs=rx+sz.w+G.SIDE;
  if(rs.bs.length)bw=Math.max(bw,rxs+rs.w);
  bw=Math.max(bw,rx+sz.w);bh=Math.max(bh,sideH);
  return {n:n,w:bw,h:bh,rx:rx,cw:sz.w,ch:sz.h,mb:mb,kp:kp,ls:ls,rs:rs,startY:startY};
}
function rpath(p,r){
  var d='M'+p[0][0]+' '+p[0][1];
  for(var i=1;i<p.length-1;i++){
    var a=p[i-1],b=p[i],c=p[i+1],v1=[a[0]-b[0],a[1]-b[1]],v2=[c[0]-b[0],c[1]-b[1]],l1=Math.hypot(v1[0],v1[1]),l2=Math.hypot(v2[0],v2[1]);
    var rr=Math.min(r,l1/2,l2/2);
    if(rr<1||(v1[0]*v2[1]-v1[1]*v2[0])===0){d+='L'+b[0]+' '+b[1];continue}
    d+='L'+(b[0]+v1[0]/l1*rr)+' '+(b[1]+v1[1]/l1*rr)+'Q'+b[0]+' '+b[1]+' '+(b[0]+v2[0]/l2*rr)+' '+(b[1]+v2[1]/l2*rr);
  }
  var q=p[p.length-1];return d+'L'+q[0]+' '+q[1];
}
function compute(ignore){
  var root=S.nodes.filter(function(n){return !n.parent})[0];
  var out={cards:[],wires:[],panels:[],W:0,H:0};
  if(!root)return out;
  var b=lay(root,ignore);
  function wd(d){return d<=1?2.6:d<=3?2:1.5}
  function place(b,x,y,d){
    var n=b.n,px=x+b.rx,py=y,cw=b.cw,ch=b.ch;
    var hidden=n.collapsed&&!ignore;
    out.cards.push({n:n,x:px,y:py,w:cw,h:ch,kids:kidsOf(n.id).length});
    if(n.group){var cnt=descendants(n.id).filter(isPerson).length+1;out.panels.push({x:x-16,y:py-34,w:b.w+32,h:b.h+34+18,label:n.dept||n.title,count:cnt,id:n.id})}
    var bottom=py+ch;
    b.mb.forEach(function(kb,i){
      var kx=x+b.kp[i].dx,ky=y+b.kp[i].dy,k=kb.n;
      place(kb,kx,ky,d+1);
      var kcx=kx+kb.rx+kb.cw/2;
      if(n.mode==='v'&&kb.rx===0){
        var sx=px+20,cy=ky+kb.ch/2;
        out.wires.push({pts:[[sx,bottom],[sx,cy],[kx,cy]],to:kb.n.id,dot:1,w:wd(d)});
      }else{
        var bus=bottom+Math.min(22,(ky-bottom)/2);
        out.wires.push({pts:[[px+cw/2,bottom],[px+cw/2,bus],[kcx,bus],[kcx,ky]],to:kb.n.id,dot:1,w:wd(d)});
      }
    });
    b.ls.bs.forEach(function(kb,i){
      var kx=px-G.SIDE-kb.w+(kb.w-kb.cw-kb.rx)*0, ky=y+b.ls.pos[i];
      kx=px-G.SIDE-kb.w;
      place(kb,kx,ky,d+1);
      var cy=ky+kb.ch/2,kr=kx+kb.rx+kb.cw,mx=px-G.SIDE/2;
      out.wires.push({pts:[[px,py+ch/2],[mx,py+ch/2],[mx,cy],[kr,cy]],to:kb.n.id,dot:1,w:wd(d)});
    });
    b.rs.bs.forEach(function(kb,i){
      var kx=px+cw+G.SIDE,ky=y+b.rs.pos[i];
      place(kb,kx,ky,d+1);
      var cy=ky+kb.ch/2,mx=px+cw+G.SIDE/2;
      out.wires.push({pts:[[px+cw,py+ch/2],[mx,py+ch/2],[mx,cy],[kx+kb.rx,cy]],to:kb.n.id,dot:1,w:wd(d)});
    });
  }
  place(b,0,0,0);
  var axis=out.cards[0].x+out.cards[0].w/2,half=0,y0=1e9,y1=-1e9;
  out.cards.forEach(function(c){half=Math.max(half,Math.abs(c.x-axis),Math.abs(c.x+c.w-axis));y0=Math.min(y0,c.y);y1=Math.max(y1,c.y+c.h+12)});
  out.panels.forEach(function(c){half=Math.max(half,Math.abs(c.x-axis),Math.abs(c.x+c.w-axis));y0=Math.min(y0,c.y);y1=Math.max(y1,c.y+c.h)});
  var pad=64,dx=half+pad-axis,dy=pad-y0;
  out.cards.forEach(function(c){c.x+=dx;c.y+=dy});
  out.panels.forEach(function(c){c.x+=dx;c.y+=dy});
  out.wires.forEach(function(w){w.pts=w.pts.map(function(p){return [p[0]+dx,p[1]+dy]})});
  out.W=(half+pad)*2;out.H=y1-y0+pad*2;out.axis=half+pad;
  return out;
}

function apply(){world.style.transform='translate('+S.tx+'px,'+S.ty+'px) scale('+S.k+')';$('#lvl').textContent=Math.round(S.k*100)+'%';$('#amb').style.transform='translate('+(S.tx*.06)+'px,'+(S.ty*.06)+'px)'}
var anim=null,reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function go(tx,ty,k,smooth){
  cancelAnimationFrame(anim);
  if(!smooth||reduce){S.tx=tx;S.ty=ty;S.k=k;apply();return}
  var a=[S.tx,S.ty,S.k],t0=performance.now(),D=420;
  (function step(t){var p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);S.tx=a[0]+(tx-a[0])*e;S.ty=a[1]+(ty-a[1])*e;S.k=a[2]+(k-a[2])*e;apply();if(p<1)anim=requestAnimationFrame(step)})(t0);
}
function frame(x,y,w,h,smooth,max){
  var vw=innerWidth,vh=innerHeight,narrow=vw<860;
  var top=narrow?168:112,bot=narrow?130:84,side=narrow?16:28,right=(sheet.hidden||narrow)?side:side+370;
  var k=Math.min((vw-side-right)/w,(vh-top-bot)/h,max||1);k=Math.max(.12,k);
  go(side+(vw-side-right-w*k)/2-x*k,top+(vh-top-bot-h*k)/2-y*k,k,smooth);
}
function fit(smooth){S.fitted=true;S.dock='fit';markDock();frame(0,0,L.W,L.H,smooth,1)}

  S.fitted=false;frame(c.x-160,c.y-100,c.w+320,c.h+200,true,k||1);
}
function zoomAt(f,cx,cy){var k=Math.min(2.5,Math.max(.12,S.k*f));f=k/S.k;S.tx=cx-(cx-S.tx)*f;S.ty=cy-(cy-S.ty)*f;S.k=k;S.fitted=false;if(S.dock){S.dock=null;markDock()}apply()}

  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});S.moved=false;cancelAnimationFrame(anim);
  if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty};
  else if(ptrs.size===2){var p=[...ptrs.values()];pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),k:S.k};drag=null}
});

  if(c&&e.pointerType==='mouse'){var r=c.getBoundingClientRect();c.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');c.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%')}
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){var p=[...ptrs.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),cx=(p[0].x+p[1].x)/2,cy=(p[0].y+p[1].y)/2;zoomAt(Math.min(2.5,Math.max(.12,pinch.k*d/pinch.d))/S.k,cx,cy);S.moved=true;return}
  if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;

  else{S.tx-=e.shiftKey&&!e.deltaX?e.deltaY:e.deltaX;S.ty-=e.shiftKey&&!e.deltaX?0:e.deltaY;S.fitted=false;apply()}
},{passive:false});

async function saveFile(name,blob){
  try{var d=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(d){await d.save({filename:name,data:blob});return true}}catch(e){if(e&&e.code==='declined')return false}
  try{var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);return true}catch(e){return false}
}

function mix(c,w,t){var a=hex(c);return a.map(function(v){return Math.round(v*(1-t)+255*t)})}

function pdfChart(fmt,all){

  doc.setProperties({title:'Swift Strips India Private Limited — Organization chart',author:'Swift Strips India Private Limited',subject:'Organization chart'});

  var mk=14*f,mx=m,my=m-2*f;
  try{doc.addImage(LOGO,'PNG',mx,my,mk,mk)}catch(e){}
  var tx0=m+mk+4*f;
  doc.setFont('times','bold');doc.setTextColor(28,36,128);doc.setFontSize(23*f);
  doc.text('Swift Strips India Private Limited',tx0,my+mk*.42);
  doc.setFont('helvetica','normal');doc.setFontSize(10.5*f);doc.setTextColor(muted[0],muted[1],muted[2]);

  doc.setFontSize(8.5*f);doc.setTextColor(140,145,175);
  doc.text('ORGANIZATION CHART  ·  '+ppl+' PEOPLE  ·  '+new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}).toUpperCase(),tx0,my+mk*.42+11.2*f,{charSpace:.25*f});
  doc.setFontSize(10*f);
  var lx=PW-m;doc.setFontSize(10*f);
  ['team','senior','head','exec'].forEach(function(t){var lab=TIER[t].label,w=doc.getTextWidth(lab);lx-=w;doc.setTextColor(muted[0],muted[1],muted[2]);doc.text(lab,lx,my+mk*.62);lx-=3.2*f;var c=hex(TIER[t].c);doc.setFillColor(c[0],c[1],c[2]);doc.circle(lx,my+mk*.62-1.1*f,1.3*f,'F');lx-=7*f});
  doc.setDrawColor(214,222,233);doc.setLineWidth(.25*f);doc.line(m,hh+m*.35,PW-m,hh+m*.35);
  /* chart */
  var ax=m,ay=hh+m*.8,aw=PW-2*m,ah=PH-ay-m-4*f,s=Math.min(aw/C.W,ah/C.H),ox=ax+(aw-C.W*s)/2,oy=ay+(ah-C.H*s)/2;
  function X(v){return ox+v*s}function Y(v){return oy+v*s}

    doc.setFillColor(243,243,250);doc.setDrawColor(220,222,238);doc.setLineWidth(1*s);doc.roundedRect(X(p.x),Y(p.y),p.w*s,p.h*s,26*s,26*s,'FD');
    doc.setFont('helvetica','bold');doc.setFontSize(11*s*2.835);doc.setTextColor(muted[0],muted[1],muted[2]);doc.text(p.label.toUpperCase(),X(p.x+20),Y(p.y+22),{charSpace:.4*s});
    var lw=doc.getTextWidth(p.label.toUpperCase())+.4*s*p.label.length;doc.setFont('helvetica','normal');doc.setTextColor(140,155,175);doc.text(String(p.count),X(p.x+20)+lw+5*s,Y(p.y+22));
  });
  doc.setDrawColor(124,132,184);doc.setLineJoin('round');doc.setLineCap('round');
  C.wires.forEach(function(w){var p=w.pts;doc.setLineWidth(w.w*s);for(var i=1;i<p.length;i++)doc.line(X(p[i-1][0]),Y(p[i-1][1]),X(p[i][0]),Y(p[i][1]));var e=p[p.length-1];doc.setFillColor(124,132,184);doc.circle(X(e[0]),Y(e[1]),w.w*1.7*s,'F')});
  function fit(str,w){if(doc.getTextWidth(str)<=w)return str;while(str.length>1&&doc.getTextWidth(str+'…')>w)str=str.slice(0,-1);return str+'…'}
  C.cards.forEach(function(c){

    if(n.tier==='unit'){doc.setFont('helvetica','bold');doc.setFontSize(11.5*s*2.835);var dk=hex(tc);doc.setTextColor(dk[0]*.6,dk[1]*.6,dk[2]*.6);doc.text(fit(n.title.toUpperCase(),w-24*s),x+w/2,y+h/2,{align:'center',baseline:'middle',charSpace:.5*s});return}

    doc.setFont('helvetica','bold');doc.setFontSize(9.5*s*2.835);doc.setTextColor(muted[0],muted[1],muted[2]);doc.text(fit(n.title.toUpperCase(),tw),tx,yy+8.5*s,{charSpace:.3*s});

    if(n.collapsed&&!all){var cnt='+'+descendants(n.id).length;doc.setFont('helvetica','bold');doc.setFontSize(10*s*2.835);var cw=doc.getTextWidth(cnt)+12*s;doc.setFillColor(255,255,255);doc.setDrawColor(190,200,214);doc.roundedRect(x+w/2-cw/2,y+h-8*s,cw,18*s,9*s,9*s,'FD');doc.setTextColor(muted[0],muted[1],muted[2]);doc.text(cnt,x+w/2,y+h+1*s,{align:'center',baseline:'middle'})}
  });
  doc.setFont('helvetica','normal');doc.setFontSize(8*f);doc.setTextColor(140,155,175);doc.text('Swift Strips India Private Limited · SLTT Group · Confidential',m,PH-m*.55);

}
$('#doPdf').onclick=async function(){
  var b=this,old=b.textContent;b.textContent='Preparing PDF…';
  try{var blob=pdfChart($('#pgsz').value,$('#pdfAll').checked);var ok=await saveFile('swift-strips-organization-chart-'+$('#pgsz').value.toUpperCase()+'.pdf',blob);if(ok){closeMenu();toast('PDF ready')}}
  catch(e){toast('Couldn’t build the PDF: '+(e&&e.message||'unknown error'))}
  b.textContent=old;
};
window.__ssi={pdf:pdfChart,state:S,compute:compute};

/* ---------- boot ---------- */
(function boot(){
  try{var th=localStorage.getItem(KEY+'-theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
  (function(){var l=document.getElementById('logo');if(l)l.src=LOGO;var f=document.querySelector('link[rel=icon]');if(f)f.href=LOGO})();
  load();renderLegend();renderWorld();updateHeader();updUR();fit(false);
  if(innerWidth<860){var ids={md:1,dir:1,ceo:1,ea:1,hr:1,plant:1,qc:1,s5:1,pmo:1},x0=1e9,y0=1e9,x1=0,y1=0;
    L.cards.forEach(function(c){if(ids[c.n.id]){x0=Math.min(x0,c.x);y0=Math.min(y0,c.y);x1=Math.max(x1,c.x+c.w);y1=Math.max(y1,c.y+c.h)}});
    if(x1>x0){S.fitted=false;S.dock=null;markDock();frame(x0-20,y0-20,x1-x0+40,y1-y0+40,false,1)}}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){});
  var cl=window.claude;
  if(cl&&cl.use){cl.use('db').then(function(d){
    if(!d)return;db=d;ref=db.doc('charts/org');
    ref.onSnapshot(function(snap){
      if(!snap.exists)return;var v=snap.data();if(!v||!v.json||v.by===tabId)return;
      try{var a=JSON.parse(v.json);if(Array.isArray(a)&&a.length&&JSON.stringify(a)!==snapJSON()){S.nodes=a;if(S.sel&&!byId(S.sel))S.sel=null;renderWorld();updateHeader();renderSheet();setStatus('Saved');if(S.fitted)fit(false)}}catch(e){}
    },function(){});
  }).catch(function(){})}
})();
})();
</script>
